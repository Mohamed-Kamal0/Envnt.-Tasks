<section class="container page stack">
  <h1>Contact Us</h1>
  <div class="card stack" style="max-width: 420px">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" class="input" type="email" placeholder="you@example.com" />
    </div>
    <div class="field">
      <label for="message">Message</label>
      <textarea id="message" class="input" rows="4" placeholder="How can we help?"></textarea>
    </div>
    <button class="btn" type="button">Send</button>
  </div>
</section>
