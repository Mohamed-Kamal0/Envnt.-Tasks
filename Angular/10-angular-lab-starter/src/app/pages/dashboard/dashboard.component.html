<!--
  #Task 7: Build the dashboard template here.
  - Add a heading and a "Sign out" button, bound (click) to the component's
    logout() method (which calls into the authentication service and
    navigates back to the login page).
  - Include a short note that this page is reachable because authGuard found
    a valid session, and that opening it in a private window while signed out
    bounces back to /login. Day 5 turns this into the real product
    management screen.
-->

<section class="container page stack">
  <div class="row between">
    <h1>Dashboard</h1>
    <button class="btn btn-ghost" (click)="logout()">Sign out</button>
  </div>

  <div class="card stack">
    <p>
      You reached this page because <code>authGuard</code> found a valid
      session. Try opening this URL in a private window while signed out — you
      get bounced to <code>/login</code> instead.
    </p>
    <p class="hint">
      Day 5 turns this into the real product management screen.
    </p>
  </div>
</section>
