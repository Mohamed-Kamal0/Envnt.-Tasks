<form (ngSubmit)="onSubmit()">
  <div class="form-group">
    <label for="name">name</label>
    <input
      [(ngModel)]="name"
      name="name"
      type="email"
      class="form-control"
      id="email"
    />
  </div>
  <div class="form-group">
    <label for="name">price</label>
    <input
      [(ngModel)]="price"
      name="price"
      type="number"
      class="form-control"
      id="price"
    />
  </div>

  <button type="submit" class="btn btn-default">Submit</button>
</form>
